<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Dừng lệnh đang chạy bằng Ctrl + C</title><desc id="desc">Terminal chạy ping 127.0.0.1, xuất hiện các dòng phản hồi liên tiếp. Nhấn Ctrl+C sẽ in thống kê và trả về dấu nhắc. Đây là kiểm tra chính máy Ubuntu, không phải Internet hay robot.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#17334e}.title{font-size:30px;font-weight:700}.small{font-size:20px}.mono{font-family:Consolas,monospace;font-size:23px}.white{fill:#fff}.muted{fill:#53697d}.green{fill:#8ae59c}.orange{fill:#ffbc8c}.bold{font-weight:700}</style>
<rect x="0" y="0" width="1120" height="680" rx="16" fill="#f4f7fb"/>
<text x="36" y="48" class="title">Dừng lệnh đang chạy bằng Ctrl + C</text>
<text x="36" y="82" class="small muted">MINH HỌA • Tên tài khoản và giao diện thực tế có thể khác.</text>
<rect x="36" y="115" width="1048" height="407" rx="10" fill="#2d1230"/>
<rect x="36" y="115" width="1048" height="42" rx="10" fill="#34313a"/>
<rect x="36" y="140" width="1048" height="17" rx="0" fill="#34313a"/>
<text x="56" y="144" class="small white">robovis@ubuntu: ~</text>
<text x="1053" y="144" class="white">×</text>
<text x="62" y="195" class="mono green">robovis@ubuntu:~$ ping 127.0.0.1</text>
<text x="62" y="235" class="mono white">PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data.</text>
<text x="62" y="275" class="mono white">64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.040 ms</text>
<text x="62" y="315" class="mono white">64 bytes from 127.0.0.1: icmp_seq=2 ttl=64 time=0.035 ms</text>
<text x="62" y="355" class="mono orange">^C</text>
<text x="62" y="395" class="mono white">--- 127.0.0.1 ping statistics ---</text>
<text x="62" y="435" class="mono white">2 packets transmitted, 2 received, 0% packet loss</text>
<text x="62" y="475" class="mono green">robovis@ubuntu:~$</text>
<rect x="58" y="555" width="1004" height="74" rx="8" fill="#eaf2fc"/>
<text x="78" y="585" class="bold">Ctrl + C: yêu cầu dừng chương trình đang chạy.</text>
<text x="78" y="614" class="small">Dấu nhắc quay lại: bạn có thể nhập lệnh mới. Thời gian phản hồi chỉ là ví dụ.</text>
</svg>
