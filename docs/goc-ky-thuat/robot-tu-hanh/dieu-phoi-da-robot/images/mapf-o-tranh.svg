<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Đổi chỗ qua ô tránh: một lịch MAPF hợp lệ</title><desc id="desc">Đồ thị A-X-B và nhánh X-C. R1 đi A đến B, R2 đi B đến A. Lịch từ bước 0 đến 5 không có cùng node hoặc đổi chỗ trên cạnh.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#183b56}.title{font-size:29px;font-weight:700}.small{font-size:20px}.bold{font-weight:700}.white{fill:white}.muted{fill:#53697d}</style>
