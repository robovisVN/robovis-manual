<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Ba cách tổ chức quyết định phối hợp</title><desc id="desc">Tập trung có bộ điều phối chung; phân tán có quyết định phối hợp giữa các robot; lai kết hợp quyết định chung và xử lý trên robot.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#183b56}.title{font-size:29px;font-weight:700}.small{font-size:20px}.bold{font-weight:700}.white{fill:white}.muted{fill:#53697d}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3672a4"/></marker></defs>
<rect width="1120" height="600" rx="16" fill="#f4f7fb"/>
<text x="36" y="48" class="title">Ba cách tổ chức quyết định phối hợp</text>
<text x="36" y="82" class="small muted">SƠ ĐỒ KHÁI NIỆM • Không mô tả mọi kết nối dữ liệu của một hệ cụ thể.</text>
<rect x="36" y="122" width="334" height="385" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="58" y="158" class="bold">Tập trung</text>
<rect x="393" y="122" width="334" height="385" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="415" y="158" class="bold">Phân tán</text>
<rect x="750" y="122" width="334" height="385" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="772" y="158" class="bold">Lai / phân cấp</text>
<rect x="60" y="190" width="286" height="63" rx="10" fill="#e5effc" stroke="#c8d8e7"/>
<text x="102" y="230" class="small bold">Bộ điều phối chung</text>
<path d="M203 257L105 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="105" cy="355" r="26" fill="#2467b5"/><text x="97" y="363" class="white bold">A</text>
<path d="M203 257L203 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="203" cy="355" r="26" fill="#2467b5"/><text x="195" y="363" class="white bold">B</text>
<path d="M203 257L301 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="301" cy="355" r="26" fill="#2467b5"/><text x="293" y="363" class="white bold">C</text>
<text x="61" y="438" class="small">Quyền chung do trung tâm cấp.</text>
<text x="61" y="472" class="small">Robot vẫn có xử lý cục bộ.</text>
<path d="M465 239L607 239" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M465 251L527 346" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M606 251L547 346" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<circle cx="453" cy="239" r="26" fill="#147d78"/><text x="445" y="247" class="white bold">A</text>
<circle cx="620" cy="239" r="26" fill="#147d78"/><text x="612" y="247" class="white bold">B</text>
<circle cx="536" cy="373" r="26" fill="#147d78"/><text x="528" y="381" class="white bold">C</text>
<text x="417" y="438" class="small">Quyết định phối hợp được chia</text>
<text x="417" y="472" class="small">giữa các thành phần / robot.</text>
<rect x="774" y="190" width="286" height="63" rx="10" fill="#e5effc" stroke="#c8d8e7"/>
<text x="834" y="230" class="small bold">Điều phối chung</text>
<path d="M917 257L817 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="817" cy="355" r="26" fill="#147d78"/><text x="809" y="363" class="white bold">A</text>
<path d="M917 257L915 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="915" cy="355" r="26" fill="#147d78"/><text x="907" y="363" class="white bold">B</text>
<path d="M917 257L1013 325" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="1013" cy="355" r="26" fill="#147d78"/><text x="1005" y="363" class="white bold">C</text>
<text x="774" y="438" class="small">Quản lý tài nguyên ở lớp chung.</text>
<text x="774" y="472" class="small">Phản ứng trên từng robot.</text>
<text x="36" y="555" class="small muted">Cần xác định rõ: ai có quyền quyết định, biết thông tin gì và phản ứng thế nào khi lỗi.</text>
</svg>