<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ cần cả YAML và ảnh PGM</title><desc id="desc">m_map.yaml tham chiếu image: m_map.pgm. YAML chứa thông tin bản đồ, PGM chứa ảnh lưới chiếm chỗ. Sao lưu cả hai tệp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3672a4"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183b56;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:20px}.bold{font-weight:700}.mono{font-family:Consolas,monospace}.muted{fill:#53697d}.white{fill:white}.accent{fill:#1765b0}</style>
<rect x="0" y="0" width="1120" height="460" rx="16" fill="#f4f7fb" stroke="#c8d8e7"/>
<text x="36" y="48" class="title">Bản đồ cần cả YAML và ảnh PGM</text>
<text x="36" y="82" class="small muted">SƠ ĐỒ MINH HỌA • Đọc cùng các bước và cấu hình trong bài.</text>
<rect x="36" y="140" width="450" height="185" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="54" y="206" class="bold" style="font-size:23px">m_map.yaml</text>
<text x="54" y="244" class="small" style="font-size:20px">Thông tin độ phân giải, gốc tọa độ</text>
<text x="54" y="274" class="small" style="font-size:20px">image: m_map.pgm</text>
<rect x="632" y="140" width="450" height="185" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="650" y="206" class="bold" style="font-size:23px">m_map.pgm</text>
<text x="650" y="244" class="small" style="font-size:20px">Ảnh lưới chiếm chỗ</text>
<text x="650" y="274" class="small" style="font-size:20px">Dữ liệu hình học của bản đồ</text>
<path d="M500 235L615 235" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="511" y="209" class="small">image</text>
<text x="36" y="412" class="small muted">Sao lưu cả hai tệp. Nếu đổi tên hoặc chuyển ảnh, kiểm tra lại đường dẫn image trong YAML.</text>
</svg>
