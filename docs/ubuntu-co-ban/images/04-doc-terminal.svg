<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Đọc một lệnh trong Terminal</title><desc id="desc">Ví dụ robovis@ubuntu:~$ pwd. Phần trước pwd là dấu nhắc, pwd là lệnh cần nhập, /home/robovis là kết quả, dấu nhắc mới cho biết lệnh đã kết thúc.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#17334e}.title{font-size:30px;font-weight:700}.small{font-size:20px}.mono{font-family:Consolas,monospace;font-size:23px}.white{fill:#fff}.muted{fill:#53697d}.green{fill:#8ae59c}.orange{fill:#ffbc8c}.bold{font-weight:700}</style>
<rect x="0" y="0" width="1120" height="650" rx="16" fill="#f4f7fb"/>
<text x="36" y="48" class="title">Đọc một lệnh trong Terminal</text>
<text x="36" y="82" class="small muted">MINH HỌA • Tên tài khoản và giao diện thực tế có thể khác.</text>
<rect x="36" y="115" width="1048" height="287" rx="10" fill="#2d1230"/>
<rect x="36" y="115" width="1048" height="42" rx="10" fill="#34313a"/>
<rect x="36" y="140" width="1048" height="17" rx="0" fill="#34313a"/>
<text x="56" y="144" class="small white">robovis@ubuntu: ~</text>
<text x="1053" y="144" class="white">×</text>
<text x="68" y="209" class="mono green">robovis@ubuntu:~$</text>
<text x="321" y="209" class="mono white">pwd</text>
<circle cx="589" cy="202" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="583" y="209" class="small white bold">1</text>
<text x="68" y="264" class="mono white">/home/robovis</text>
<circle cx="589" cy="257" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="583" y="264" class="small white bold">2</text>
<text x="68" y="319" class="mono green">robovis@ubuntu:~$</text>
<rect x="323" y="298" width="12" height="26" rx="0" fill="#fff"/>
<circle cx="589" cy="312" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="583" y="319" class="small white bold">3</text>
<text x="639" y="208" class="white">Nhập pwd rồi nhấn Enter.</text>
<text x="639" y="263" class="white">Đây là kết quả trả về.</text>
<text x="639" y="318" class="white">Đã xong, có thể nhập tiếp.</text>
<text x="58" y="450" class="bold">Phân biệt các phần của dấu nhắc</text>
<rect x="58" y="474" width="230" height="112" rx="8" fill="#fff" stroke="#d3dde8"/>
<text x="76" y="514" class="mono bold">robovis</text>
<text x="76" y="552" class="small">Tên tài khoản</text>
<rect x="304" y="474" width="210" height="112" rx="8" fill="#fff" stroke="#d3dde8"/>
<text x="322" y="514" class="mono bold">ubuntu</text>
<text x="322" y="552" class="small">Tên máy</text>
<rect x="530" y="474" width="220" height="112" rx="8" fill="#fff" stroke="#d3dde8"/>
<text x="548" y="514" class="mono bold">~</text>
<text x="548" y="552" class="small">Thư mục Home</text>
<rect x="766" y="474" width="288" height="112" rx="8" fill="#fff" stroke="#d3dde8"/>
<text x="784" y="514" class="mono bold">$</text>
<text x="784" y="552" class="small">Đang chờ lệnh</text>
<text x="58" y="625" class="small muted">Chỉ nhập pwd. Không gõ lại robovis@ubuntu:~$ và không dán phần kết quả.</text>
</svg>
