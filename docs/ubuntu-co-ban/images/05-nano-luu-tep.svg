<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Nhập, lưu và thoát tệp trong nano</title><desc id="desc">Nano đang sửa ghi_chu.txt với hai dòng ghi chú. Thanh dưới có ^O Write Out và ^X Exit. Thao tác lưu: Ctrl+O, Enter xác nhận tên, Ctrl+X thoát.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#17334e}.title{font-size:30px;font-weight:700}.small{font-size:20px}.mono{font-family:Consolas,monospace;font-size:23px}.white{fill:#fff}.muted{fill:#53697d}.green{fill:#8ae59c}.orange{fill:#ffbc8c}.bold{font-weight:700}</style>
<rect x="0" y="0" width="1120" height="650" rx="16" fill="#f4f7fb"/>
<text x="36" y="48" class="title">Nhập, lưu và thoát tệp trong nano</text>
<text x="36" y="82" class="small muted">MINH HỌA • Tên tài khoản và giao diện thực tế có thể khác.</text>
<rect x="36" y="115" width="1048" height="306" rx="10" fill="#2d1230"/>
<rect x="36" y="115" width="1048" height="42" rx="10" fill="#34313a"/>
<rect x="36" y="140" width="1048" height="17" rx="0" fill="#34313a"/>
<text x="56" y="144" class="small white">nano ghi_chu.txt</text>
<text x="1053" y="144" class="white">×</text>
<rect x="52" y="170" width="1016" height="34" rx="0" fill="#c7c9ca"/>
<text x="66" y="195" class="mono">GNU nano                         ghi_chu.txt</text>
<text x="66" y="246" class="mono white">Toi dang hoc Ubuntu.</text>
<text x="66" y="285" class="mono white">Toi biet mo Terminal va tim thu muc Home.</text>
<text x="66" y="360" class="mono white">^G Help       ^O Write Out       ^W Where Is</text>
<text x="66" y="397" class="mono white">^X Exit       ^R Read File       ^K Cut</text>
<rect x="50" y="458" width="320" height="103" rx="10" fill="#fff" stroke="#c7d7e6"/>
<circle cx="78" cy="487" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="72" y="494" class="small white bold">1</text>
<text x="111" y="496" class="mono bold">Ctrl + O</text>
<text x="72" y="537" class="small">Yêu cầu lưu</text>
<rect x="400" y="458" width="320" height="103" rx="10" fill="#fff" stroke="#c7d7e6"/>
<circle cx="428" cy="487" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="422" y="494" class="small white bold">2</text>
<text x="461" y="496" class="mono bold">Enter</text>
<text x="422" y="537" class="small">Xác nhận tên tệp</text>
<rect x="750" y="458" width="320" height="103" rx="10" fill="#fff" stroke="#c7d7e6"/>
<circle cx="778" cy="487" r="17" fill="#1765b0" stroke="#fff" stroke-width="2"/>
<text x="772" y="494" class="small white bold">3</text>
<text x="811" y="496" class="mono bold">Ctrl + X</text>
<text x="772" y="537" class="small">Thoát nano</text>
<text x="58" y="610" class="small muted">Dấu ^ trong ^O và ^X có nghĩa là giữ phím Ctrl, không phải gõ ký tự ^.</text>
</svg>
