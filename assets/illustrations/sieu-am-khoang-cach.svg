<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">HC-SR04: sóng đi và sóng phản xạ</title><desc id="desc">Cảm biến phát sóng đến vật cản, nhận sóng quay lại. Khoảng cách bằng vận tốc âm nhân thời gian khứ hồi chia hai.</desc>
