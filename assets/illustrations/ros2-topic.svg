<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">Node, topic và message trong ROS 2</title><desc id="desc">Node phát → Topic → Node nhận. Một node có thể vừa phát vừa nhận trên các topic khác nhau. Có tên topic chưa chứng minh đang có message; kiểm tra thêm info, echo và hz.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3672a4"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183b56;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:20px}.bold{font-weight:700}.mono{font-family:Consolas,monospace}.muted{fill:#53697d}.white{fill:white}.accent{fill:#1765b0}</style>
<rect x="0" y="0" width="1120" height="450" rx="16" fill="#f4f7fb" stroke="#c8d8e7"/>
<text x="36" y="48" class="title">Node, topic và message trong ROS 2</text>
<text x="36" y="82" class="small muted">SƠ ĐỒ MINH HỌA • Đọc cùng các bước và cấu hình trong bài.</text>
<rect x="36.0" y="135" width="330.6666666666667" height="160" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="54.0" y="166" class="small accent bold">01</text>
<text x="54.0" y="201" class="bold" style="font-size:23px">Node phát</text>
<text x="54.0" y="239" class="small" style="font-size:20px">Publisher</text>
<text x="54.0" y="269" class="small" style="font-size:20px">Tạo dữ liệu</text>
<path d="M369.6666666666667 218L389.6666666666667 218" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="394.6666666666667" y="135" width="330.6666666666667" height="160" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="412.6666666666667" y="166" class="small accent bold">02</text>
<text x="412.6666666666667" y="201" class="bold" style="font-size:23px">Topic</text>
<text x="412.6666666666667" y="239" class="small" style="font-size:20px">Tên kênh dữ liệu</text>
<text x="412.6666666666667" y="269" class="small" style="font-size:20px">Message có kiểu xác định</text>
<path d="M728.3333333333334 218L748.3333333333334 218" stroke="#3672a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="753.3333333333334" y="135" width="330.6666666666667" height="160" rx="10" fill="#fff" stroke="#c8d8e7"/>
<text x="771.3333333333334" y="166" class="small accent bold">03</text>
<text x="771.3333333333334" y="201" class="bold" style="font-size:23px">Node nhận</text>
<text x="771.3333333333334" y="239" class="small" style="font-size:20px">Subscriber</text>
<text x="771.3333333333334" y="269" class="small" style="font-size:20px">Xử lý dữ liệu nhận</text>
<text x="36" y="372" class="small muted">Một node có thể vừa phát vừa nhận trên các topic khác nhau.</text>
<text x="36" y="402" class="small muted">Có tên topic chưa chứng minh đang có message; kiểm tra thêm info, echo và hz.</text>
</svg>
